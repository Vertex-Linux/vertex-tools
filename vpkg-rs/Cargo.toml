[package]
name = "vpkg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vpkg"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
async-trait = "0.1"
