name: Release vertex-update

on:
  push:
    tags:
      - "*-vu"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 1.0.0-vu)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: vertex-update
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary: vertex-update

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (egui / eframe requires X11/Wayland dev libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vertex-update-rs/target
          key: ${{ runner.os }}-${{ matrix.target }}-vu-cargo-${{ hashFiles('vertex-update-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-vu-cargo-

      - name: Build
        working-directory: vertex-update-rs
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          strip vertex-update-rs/target/${{ matrix.target }}/release/${{ matrix.binary }} \
            2>/dev/null || true

      - name: Rename binary for upload
        run: |
          cp vertex-update-rs/target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.binary }}-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ matrix.binary }}-${{ matrix.target }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag and version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip the trailing -vu suffix for the display version
          echo "version=${TAG%-vu}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: vertex-update ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## vertex-update ${{ steps.version.outputs.version }}

            Vertex Linux system updater — manages packages, tools, and OS config.

            ### Install

            ```bash
            # x86_64
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/vertex-update-x86_64-unknown-linux-gnu \
              -o vertex-update && chmod +x vertex-update && sudo mv vertex-update /usr/local/bin/

            # aarch64
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/vertex-update-aarch64-unknown-linux-gnu \
              -o vertex-update && chmod +x vertex-update && sudo mv vertex-update /usr/local/bin/
            ```
          files: |
            artifacts/vertex-update-x86_64-unknown-linux-gnu
            artifacts/vertex-update-aarch64-unknown-linux-gnu
