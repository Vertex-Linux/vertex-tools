[package]
name = "vertex-update"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vertex-update"
path = "src/main.rs"

[dependencies]
eframe  = "0.29"
ureq    = { version = "2", features = ["native-tls"] }
serde_json = "1"
anyhow  = "1"

[profile.release]
opt-level = 3
strip     = true
lto       = true
